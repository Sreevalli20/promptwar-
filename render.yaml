# Render deployment configuration for LexiGuard
# This configuration enables easy deployment on Render as a Node.js web service

services:
  - type: web
    name: promptwar-
    runtime: node
    plan: free
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: AI_FALLBACK_PROVIDER
        value: huggingface